<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <title>ກຳລັງເລີ່ມຕົ້ນລະບົບ | ລະບົບຂາຍຢາດີ</title>
  <link rel="stylesheet" href="./src/assets/vendor/fonts/noto-sans-lao.css">
  <style>
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans Lao', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }

    .splash-container {
      width: 480px;
      height: 330px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      position: relative;
    }

    /* Glow effect */
    .splash-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #6366f1);
      border-radius: 22px;
      z-index: -1;
      opacity: 0.5;
    }

    .logo-container {
      margin-bottom: 25px;
      position: relative;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }

    .logo-icon svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 30px;
      font-weight: 300;
    }

    .loader-bar {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 10px;
      position: absolute;
      animation: loading 1.8s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
    }

    .status-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 15px 35px rgba(99, 102, 241, 0.6); }
    }

    @keyframes loading {
      0% { left: -40%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <div class="logo-icon">
        <!-- Medical cross and capsules icon -->
        <svg viewBox="0 0 24 24">
          <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
        </svg>
      </div>
    </div>
    <div class="title">ລະບົບຂາຍຢາດີ</div>
    <div class="subtitle">POS Pharmacy Application</div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
    <div class="status-text">ກຳລັງເລີ່ມຕົ້ນລະບົບ...</div>
  </div>
</body>
</html>
