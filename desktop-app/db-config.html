<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <title>ຕັ້ງຄ່າຖານຂໍ້ມູນ | ລະບົບຂາຍຢາດີ</title>
  <link rel="stylesheet" href="./src/assets/vendor/fonts/noto-sans-lao.css">
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans Lao', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-container {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
      margin-bottom: 15px;
    }

    .logo-container svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .error-alert {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #10b981, #059669);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
    }

    button:hover {
      background: linear-gradient(90deg, #059669, #047857);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s infinite linear;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container" id="logoContainer">
        <svg viewBox="0 0 24 24" id="errorIcon">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
      </div>
      <div class="title" id="pageTitle">ຕັ້ງຄ່າຖານຂໍ້ມູນລະບົບ</div>
      <div class="subtitle" id="pageSubtitle">ເລືອກໂໝດການເຊື່ອມຕໍ່ຖານຂໍ້ມູນ (ແນະນຳໂໝດ Offline Built-in ໂດຍບໍ່ຕ້ອງໃຊ້ XAMPP)</div>
    </div>

    <div class="error-alert" id="errorAlert" style="display:none;"></div>

    <form id="configForm">
      <div class="form-group">
        <label for="db_mode">ໂໝດຖານຂໍ້ມູນ (Database Mode)</label>
        <select id="db_mode">
          <option value="embedded">🟢 Offline Built-in (Portable MariaDB ພາຍໃນຕົວແອັບ - ບໍ່ຕ້ອງໃຊ້ XAMPP)</option>
          <option value="sqlite">🟡 Offline SQLite (ຖານຂໍ້ມູນໄຟລ໌ດຽວ .db - ບໍ່ຕ້ອງໃຊ້ XAMPP)</option>
          <option value="external">🔵 External MySQL Server (ເຊື່ອມຕໍ່ XAMPP ຫຼື LAN Server)</option>
        </select>
      </div>

      <div id="externalFields" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label for="db_host">Host (IP ຖານຂໍ້ມູນ)</label>
            <input type="text" id="db_host" placeholder="127.0.0.1">
          </div>
          <div class="form-group">
            <label for="db_port">Port</label>
            <input type="text" id="db_port" placeholder="3306">
          </div>
        </div>

        <div class="form-group">
          <label for="db_name">ຊື່ຖານຂໍ້ມູນ (Database Name)</label>
          <input type="text" id="db_name" placeholder="pospharma">
        </div>

        <div class="form-group">
          <label for="db_user">ຊື່ຜູ້ໃຊ້ (Database User)</label>
          <input type="text" id="db_user" placeholder="root">
        </div>

        <div class="form-group">
          <label for="db_pass">ລະຫັດຜ່ານ (Database Password)</label>
          <input type="password" id="db_pass" placeholder="ລະຫັດຜ່ານ">
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <div class="spinner" id="btnSpinner"></div>
        <span id="btnText">ບັນທຶກ ແລະ ເລີ່ມຕົ້ນລະບົບ</span>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('configForm');
    const dbModeSelect = document.getElementById('db_mode');
    const externalFields = document.getElementById('externalFields');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const errorAlert = document.getElementById('errorAlert');

    function toggleFields() {
      externalFields.style.display = dbModeSelect.value === 'external' ? 'block' : 'none';
    }

    dbModeSelect.addEventListener('change', toggleFields);

    window.api.onInitData((data) => {
      dbModeSelect.value = data.config.db_mode || 'embedded';
      document.getElementById('db_host').value = data.config.db_host || '127.0.0.1';
      document.getElementById('db_port').value = data.config.db_port || '3306';
      document.getElementById('db_name').value = data.config.db_name || 'pospharma';
      document.getElementById('db_user').value = data.config.db_user || 'root';
      document.getElementById('db_pass').value = data.config.db_pass || '';
      toggleFields();

      if (data.errorType) {
        errorAlert.style.display = 'block';
        errorAlert.innerText = 'ບໍ່ສາມາດເຊື່ອມຕໍ່ຖານຂໍ້ມູນພາຍນອກໄດ້. ກະລຸນາເລືອກ "Offline Built-in" ເພື່ອໃຊ້ງານແບບບໍ່ຕ້ອງເປີດ XAMPP.';
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      btnSpinner.style.display = 'block';
      btnText.innerText = 'ກຳລັງເລີ່ມຕົ້ນລະບົບ...';
      errorAlert.style.display = 'none';

      const config = {
        db_mode: dbModeSelect.value,
        db_host: document.getElementById('db_host').value,
        db_port: document.getElementById('db_port').value,
        db_name: document.getElementById('db_name').value,
        db_user: document.getElementById('db_user').value,
        db_pass: document.getElementById('db_pass').value
      };

      window.api.saveDbSettings(config);
    });

    window.api.onSaveResult((result) => {
      submitBtn.disabled = false;
      btnSpinner.style.display = 'none';
      btnText.innerText = 'ບັນທຶກ ແລະ ເລີ່ມຕົ້ນລະບົບ';

      if (!result.success) {
        errorAlert.innerText = result.message;
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
