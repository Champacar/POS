<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ແຈ້ງເຕືອນສະຖານະບໍ່ມີສັນຍານອິນເຕີເນັດ - POS Pharma">
    <title>ບໍ່ມີສັນຍານອິນເຕີເນັດ | POS Pharma</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-192x192.png">
    <link rel="stylesheet" href="assets/vendor/fonts/noto-sans-lao.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --text-dark: #263238;
            --text-light: #546e7a;
            --card-bg: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Lao', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #b2dfdb 0%, #c8e6c9 40%, #dcedc8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 440px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.35rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            width: 100%;
        }
        .btn-retry:hover {
            background: #1b5e20;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1>ບໍ່ມີການເຊື່ອມຕໍ່ອິນເຕີເນັດ</h1>
        <p>ກະລຸນາກວດສອບສັນຍານ Wi-Fi ຫຼື ຂໍ້ມູນມືຖືຂອງທ່ານ ແລ້ວກົດປຸ່ມລອງໃໝ່ອີກຄັ້ງ ເພື່ອໂຫຼດຂໍ້ມູນລະບົບ.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="fas fa-redo"></i> ລອງໃໝ່ອີກຄັ້ງ (Retry)
        </button>
    </div>
</body>
</html>
